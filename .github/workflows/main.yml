name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Verify Electron and Electron Builder
        run: |
          npx electron --version
          npx electron-builder --version

      - name: Build Windows EXE
        run: npm run build:exe

      - name: Locate EXE
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -Filter *.exe | Where-Object { $_.FullName -notmatch '\\node_modules\\' }
          if (-not $files) { Write-Error 'No EXE was produced.' }
          $files | Select-Object FullName, Length

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Nitro-Rush-Windows-EXE
          path: |
            release/**/*.exe
            dist/**/*.exe
          if-no-files-found: error
